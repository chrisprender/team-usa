<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Team USA Athletes</title>
<style>
:root {
  --bg: #f6efe7;
  --paper: rgba(255, 250, 242, 0.92);
  --ink: #1f2833;
  --muted: #5f6b77;
  --line: #ded4c6;
  --shadow: 0 18px 46px rgba(54,38,22,.12);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  color: var(--ink);
  background:
    radial-gradient(circle at top right, rgba(255,255,255,.65), transparent 30%),
    linear-gradient(180deg, #fbf7f2 0%, #f5ede5 100%);
}
.wrap { max-width: 1440px; margin: 0 auto; padding: 26px 20px 40px; }
header {
  display: grid;
  grid-template-columns: minmax(260px, 1.3fr) minmax(360px, 1fr);
  gap: 18px;
  align-items: end;
  margin-bottom: 18px;
}
h1 { margin: 0 0 8px; font-size: clamp(30px, 4vw, 46px); line-height: 1; letter-spacing: -.03em; }
.subtitle { margin: 0; color: var(--muted); max-width: 72ch; line-height: 1.45; }
.controls { display: grid; gap: 12px; justify-items: stretch; }
.search-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
input, button {
  border: 1px solid var(--line); border-radius: 12px; background: white; color: var(--ink);
  font: inherit; min-height: 44px; padding: 10px 12px; box-shadow: 0 1px 0 rgba(0,0,0,.03);
}
input { min-width: 250px; flex: 1 1 260px; }
button { cursor: pointer; font-weight: 700; }
button.secondary { background: white; }
.card {
  background: var(--paper); border: 1px solid rgba(222,212,198,.9); border-radius: 24px;
  overflow: hidden; box-shadow: var(--shadow); backdrop-filter: blur(8px);
}
.topbar {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(460px, 1.1fr); gap: 16px;
  padding: 16px 18px 14px; border-bottom: 1px solid var(--line); align-items: start;
}
.stats { color: var(--muted); font-size: 14px; line-height: 1.45; }
.stats strong { color: var(--ink); }
.stats .substat { display: block; margin-top: 5px; font-size: 12px; }
.legend-wrap { min-width: 0; }
.legend-title, .view-title { display: block; font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 7px; }
.legend {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(136px, 1fr));
  gap: 8px;
}
.legend-chip {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 14px;
  padding: 7px 9px; background: rgba(255,255,255,.84); color: var(--ink); min-width: 0;
  font-size: 12px; line-height: 1.2; transition: transform .12s ease, box-shadow .12s ease, opacity .12s ease;
}
.legend-chip:hover { transform: translateY(-1px); box-shadow: 0 4px 10px rgba(0,0,0,.05); }
.legend-chip.active-hover { box-shadow: 0 0 0 2px rgba(31,40,51,.12) inset; }
.legend-chip.faded { opacity: .45; }
.dual-swatch {
  width: 18px; height: 18px; border-radius: 999px; flex: 0 0 auto;
  background: linear-gradient(135deg, var(--c1) 0 55%, var(--c2) 55% 100%);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.08);
}
.legend-chip .text { min-width: 0; }
.legend-chip .name { display: block; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend-chip .count { display: block; color: var(--muted); font-size: 11px; }
.control-panel {
  padding: 12px 18px 14px; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.35);
}
.view-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
.view-btn {
  border: 1px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.9);
  color: var(--muted); padding: 9px 12px; min-height: 0; font-size: 13px; font-weight: 700;
}
.view-btn.active { background: var(--ink); color: white; border-color: var(--ink); }
.viz-wrap { position: relative; min-height: 860px; height: 860px; }
#viz { width: 100%; height: 100%; display: block; }
.label {
  font-size: 14px; font-weight: 800; fill: var(--ink); text-anchor: middle;
}
.label-count { font-size: 12px; font-weight: 600; fill: var(--muted); text-anchor: middle; }
.group-box { fill: rgba(255,255,255,.35); stroke: rgba(222,212,198,.55); stroke-width: 1; }
.person { cursor: pointer; transition: opacity .14s ease; }
.person.dimmed { opacity: .1; }
.person.legend-dimmed { opacity: .08; }
.person.selected .outline { stroke: rgba(31,40,51,.75); stroke-width: 1.35; }
.person.running .sprite { animation: bob .22s steps(2,end) infinite; }
.person.running .leg-left { animation: leg-left .22s steps(2,end) infinite; transform-box: fill-box; transform-origin: 50% 0%; }
.person.running .leg-right { animation: leg-right .22s steps(2,end) infinite; transform-box: fill-box; transform-origin: 50% 0%; }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1px); } }
@keyframes leg-left { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
@keyframes leg-right { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(16deg); } }
.hair, .skin, .shirt, .shorts, .shoe, .prop, .outline, .face { shape-rendering: crispEdges; }
.prop { vector-effect: non-scaling-stroke; }
.prop-backdrop { fill: rgba(255,255,255,.82); stroke: rgba(31,40,51,.16); stroke-width: .45; }
.outline { fill: none; stroke: rgba(0,0,0,.0); }
.tooltip {
  position: fixed; z-index: 30; pointer-events: none; display: none; max-width: 250px; padding: 8px 10px;
  border-radius: 12px; background: rgba(31,40,51,.95); color: white; box-shadow: 0 12px 32px rgba(0,0,0,.22);
  font-size: 12px; line-height: 1.32;
}
.tooltip strong { display: block; margin-bottom: 2px; }
.below {
  padding: 16px 18px 18px; border-top: 1px solid var(--line); background: rgba(255,250,242,.72);
}
.notes { color: var(--muted); font-size: 13px; line-height: 1.48; }
.notes p { margin: 0 0 8px; }
.popover {
  position: fixed; z-index: 40; width: min(360px, calc(100vw - 24px)); background: rgba(255,255,255,.97);
  border: 1px solid rgba(222,212,198,.95); border-radius: 20px; box-shadow: 0 24px 48px rgba(22,20,17,.23);
  display: none; overflow: hidden;
}
.popover-header {
  display: grid; grid-template-columns: 84px minmax(0,1fr) auto; gap: 12px; align-items: center;
  padding: 14px 14px 12px; background: linear-gradient(180deg, rgba(250,246,241,.96), rgba(255,255,255,.98));
  border-bottom: 1px solid var(--line);
}
.avatar-card {
  width: 70px; height: 70px; display: grid; place-items: center; border-radius: 16px;
  background: linear-gradient(180deg, rgba(246,239,231,.95), rgba(255,255,255,.95)); border: 1px solid var(--line);
}
.avatar-card svg { width: 70px; height: 70px; overflow: visible; }
.popover h2 { margin: 0 0 3px; font-size: 20px; line-height: 1.05; letter-spacing: -.02em; }
.popover .meta { color: var(--muted); font-size: 13px; line-height: 1.35; }
.close-btn {
  align-self: start; width: 34px; height: 34px; min-height: 34px; border-radius: 999px; background: white;
  color: var(--muted); border: 1px solid var(--line); padding: 0; font-size: 18px; line-height: 1;
}
.popover-body { padding: 14px; display: grid; gap: 10px; }
.detail-grid { display: grid; grid-template-columns: 110px minmax(0,1fr); gap: 6px 10px; font-size: 13px; line-height: 1.38; }
.detail-grid dt { color: var(--muted); font-weight: 700; }
.detail-grid dd { margin: 0; }
.note-block { padding-top: 6px; border-top: 1px solid rgba(222,212,198,.8); }
.note-block h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.note-block p { margin: 0; font-size: 13px; line-height: 1.42; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.18); backdrop-filter: blur(1px); display: none; z-index: 35; }
@media (max-width: 1020px) {
  header, .topbar { grid-template-columns: 1fr; }
  .legend { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
  .viz-wrap { min-height: 920px; height: 920px; }
}
@media (max-width: 760px) {
  .wrap { padding: 18px 12px 28px; }
  .search-row { justify-content: stretch; }
  .topbar { padding-bottom: 16px; }
  .legend { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .viz-wrap { min-height: 980px; height: 980px; }
}
@media (prefers-reduced-motion: reduce) {
  .person.running .sprite, .person.running .leg-left, .person.running .leg-right { animation: none; }
}
</style>
</head>

      <div class="tooltip" id="tooltip"></div>
    </div>
  </main>
</div>

<script>
(() => {
  const rawAthletes = JSON.parse(document.getElementById('athlete-data').textContent);

  const FAMILY_STYLES = {
    'Athletics': ['#ff8f5a', '#de5a37'],
    'Aquatics': ['#0ea5e9', '#075985'],
    'Ball Sports': ['#8b5cf6', '#4c1d95'],
    'Combat': ['#ef4444', '#991b1b'],
    'Riding & Cycling': ['#22c55e', '#166534'],
    'Fencing': ['#cbd5e1', '#475569'],
    'Gymnastics': ['#f472b6', '#9d174d'],
    'Precision': ['#fbbf24', '#92400e'],
    'Racket Sports': ['#14b8a6', '#115e59'],
    'Rowing & Sailing': ['#2563eb', '#93c5fd'],
    'Urban & Board': ['#a3e635', '#365314'],
    'Other': ['#64748b', '#1e293b']
  };

  const VIEW_OPTIONS = [
    { key: 'all_group', label: 'All Olympians', order: ['All Olympians'] },
    { key: 'sport_family', label: 'Sport family', order: Object.keys(FAMILY_STYLES) },
    { key: 'gender', label: 'Gender', order: ['Female','Male','Unknown'] },
    { key: 'age_group', label: 'Age', order: ['Under 20','20–24','25–29','30–34','35–39','40+','Unknown'] },
    { key: 'height_group', label: 'Height', order: ['Under 5′6″','5′6″–5′9″','5′10″–6′1″','6′2″–6′4″','6′5″+','Unknown'] },
    { key: 'birth_state_group', label: 'Birthplace', order: ['California','Florida','Texas','Illinois','New York','Other U.S.','International','Unknown'] }
  ];

  const svg = document.getElementById('viz');
  const athletesLayer = document.getElementById('athletes');
  const labelsLayer = document.getElementById('labels');
  const legend = document.getElementById('legend');
  const stats = document.getElementById('stats');
  const tooltip = document.getElementById('tooltip');
  const popover = document.getElementById('popover');
  const backdrop = document.getElementById('backdrop');
  const searchInput = document.getElementById('searchInput');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const viewButtons = document.getElementById('viewButtons');
  const NS = 'http://www.w3.org/2000/svg';

  let currentView = 'all_group';
  let searchTerm = '';
  let hoveredFamily = null;
  let selectedAthlete = null;
  let animationToken = 0;
  let width = 1200;
  let height = 860;
  let lastLayoutGroups = [];

  function makeEl(name, attrs = {}, parent) {
    const el = document.createElementNS(NS, name);
    Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, String(v)));
    if (parent) parent.appendChild(el);
    return el;
  }

  function makeHTML(tag, attrs = {}, parent) {
    const el = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === 'text') el.textContent = v;
      else if (k === 'html') el.innerHTML = v;
      else el.setAttribute(k, v);
    });
    if (parent) parent.appendChild(el);
    return el;
  }

  function escapeHTML(value) {
    return String(value || '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function countBy(arr, fn) {
    const map = new Map();
    arr.forEach(item => {
      const key = fn(item);
      map.set(key, (map.get(key) || 0) + 1);
    });
    return map;
  }

  function fmtHeight(cm) {
    if (!cm) return 'Unknown';
    const inches = cm / 2.54;
    const feet = Math.floor(inches / 12);
    const rem = Math.round(inches - feet * 12);
    return `${cm} cm (${feet}′${rem}″)`;
  }

  function colorsForFamily(family) {
    return FAMILY_STYLES[family] || ['#b8b8b8','#8f8f8f'];
  }

  function propColor(a) { return colorsForFamily(a.sport_family)[1]; }

  function createSprite(parent, athlete, asAvatar = false) {
    const g = makeEl('g', { class: 'sprite' }, parent);
    const [c1, c2] = colorsForFamily(athlete.sport_family);
    const skin = '#f1c7a0';
    const hair = athlete.gender === 'Female' ? '#5c4034' : '#2d2f35';
    const shorts = c2;
    const shirt = c1;
    const outline = makeEl('rect', { x: -6.5, y: -20.5, width: 13, height: 22, rx: 1.5, class: 'outline' }, g);
    const pony = athlete.gender === 'Female';

    // shadow/feet base
    makeEl('rect', { x: -5.5, y: 10, width: 11, height: 1.4, fill: 'rgba(31,40,51,.10)' }, g);
    // head
    makeEl('rect', { x: -3, y: -18, width: 6, height: 6, rx: 1, fill: skin, class: 'skin' }, g);
    makeEl('rect', { x: -3.5, y: -18.5, width: 7, height: 3, fill: hair, class: 'hair' }, g);
    if (pony) {
      makeEl('rect', { x: 3, y: -16, width: 2, height: 5, fill: hair, class: 'hair' }, g);
      makeEl('rect', { x: 3.5, y: -11.5, width: 1.5, height: 2, fill: c2, class: 'hair' }, g);
    } else {
      makeEl('rect', { x: -3.5, y: -15.8, width: 1, height: 2.2, fill: hair, class: 'hair' }, g);
      makeEl('rect', { x: 2.5, y: -15.8, width: 1, height: 2.2, fill: hair, class: 'hair' }, g);
    }
    // face dots
    makeEl('rect', { x: -1.8, y: -15.5, width: .7, height: .7, fill: '#513a32', class: 'face' }, g);
    makeEl('rect', { x: 1.1, y: -15.5, width: .7, height: .7, fill: '#513a32', class: 'face' }, g);
    // body
    makeEl('rect', { x: -4.5, y: -11.5, width: 9, height: 8, rx: 1, fill: shirt, class: 'shirt' }, g);
    makeEl('rect', { x: -2.5, y: -10, width: 5, height: 1, fill: 'rgba(255,255,255,.38)' }, g);
    makeEl('rect', { x: -4.5, y: -3.5, width: 9, height: 3.5, rx: 1, fill: shorts, class: 'shorts' }, g);
    // arms
    makeEl('rect', { x: -6.2, y: -10.8, width: 1.6, height: 7, rx: .7, fill: c2 }, g);
    makeEl('rect', { x: 4.6, y: -10.8, width: 1.6, height: 7, rx: .7, fill: c2 }, g);
    // legs
    makeEl('rect', { x: -3.4, y: 0, width: 2.3, height: 8.2, rx: .8, fill: '#39424c', class: 'leg-left' }, g);
    makeEl('rect', { x: 1.1, y: 0, width: 2.3, height: 8.2, rx: .8, fill: '#39424c', class: 'leg-right' }, g);
    makeEl('rect', { x: -3.7, y: 8, width: 3.2, height: 1.7, fill: '#0e141a', class: 'shoe' }, g);
    makeEl('rect', { x: .8, y: 8, width: 3.2, height: 1.7, fill: '#0e141a', class: 'shoe' }, g);
    // prop/details
    addProp(g, athlete, asAvatar);
    return outline;
  }

  function addProp(g, athlete, asAvatar) {
    const fill = propColor(athlete);
    const p = athlete.prop;
    const add = (name, attrs) => makeEl(name, Object.assign({ class: 'prop' }, attrs), g);
    const haloProps = new Set(['sword','basketball','volleyball','rugby','target','racket','paddle','shuttle','sail','climb','music','golf','tri','star','barbell','horse','waveball','medal','dot']);
    if (haloProps.has(p)) {
      makeEl('circle', { cx: 8.1, cy: -5.3, r: asAvatar ? 4.2 : 3.7, class: 'prop-backdrop' }, g);
    }
    switch (p) {
      case 'sword':
        add('rect', { x: 5.8, y: -9.8, width: 1, height: 10, fill });
        add('rect', { x: 5.1, y: -2.8, width: 2.4, height: .9, fill });
        break;
      case 'bike':
        add('circle', { cx: -6, cy: 8.6, r: 1.9, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('circle', { cx: 6, cy: 8.6, r: 1.9, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('path', { d: 'M-6 8.6 L-1 3.8 L2 8.6 L6 8.6 L1 3.8 L3 1.8', fill: 'none', stroke: fill, 'stroke-width': 1.25, 'stroke-linecap': 'square' });
        break;
      case 'basketball':
        add('circle', { cx: 7.5, cy: -5, r: 2.4, fill: 'none', stroke: fill, 'stroke-width': 1.35 });
        add('path', { d: 'M5.4 -5 H9.6 M7.5 -7.1 V-2.9 M5.9 -6.6 C7.2 -5.8 7.2 -4.2 5.9 -3.4 M9.1 -6.6 C7.8 -5.8 7.8 -4.2 9.1 -3.4', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        break;
      case 'soccer':
        add('circle', { cx: 7.2, cy: 8.2, r: 2.1, fill: 'white', stroke: fill, 'stroke-width': 1.1 });
        add('rect', { x: 6.5, y: 7.4, width: 1.4, height: 1.4, fill });
        break;
      case 'volleyball':
        add('circle', { cx: 7.3, cy: -5.1, r: 2.2, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('path', { d: 'M5.3 -5.2 C6.7 -6.8 8.3 -6.8 9.2 -5.2 M5.8 -3.8 C7 -4.6 7.9 -4.7 8.9 -3.9', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        break;
      case 'hockeystick':
        add('path', { d: 'M6 -9 L7 3 L9 4', fill: 'none', stroke: fill, 'stroke-width': 1.2, 'stroke-linecap': 'square' });
        break;
      case 'rugby':
        add('ellipse', { cx: 7.2, cy: -5, rx: 2.7, ry: 1.7, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('path', { d: 'M5.6 -5 H8.8 M7.2 -6.2 V-3.8', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        break;
      case 'glove':
        add('path', { d: 'M6 -8 h3 v2 h1.5 v3 h-1 v2 h-4 z', fill });
        break;
      case 'belt':
        add('rect', { x: -4.7, y: -4.2, width: 9.4, height: .9, fill: '#fff' });
        break;
      case 'kick':
        add('path', { d: 'M1.2 3 L6 1 L8 3.2 L4 4.2', fill });
        break;
      case 'target':
        add('circle', { cx: 8.2, cy: -5.2, r: 2.8, fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        add('circle', { cx: 8.2, cy: -5.2, r: 1.5, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('circle', { cx: 8.2, cy: -5.2, r: .5, fill });
        break;
      case 'racket':
        add('ellipse', { cx: 7.3, cy: -6.5, rx: 2.1, ry: 3.1, fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        add('path', { d: 'M6.6 -3.4 L5.2 -1.3', fill: 'none', stroke: fill, 'stroke-width': 1.35 });
        break;
      case 'paddle':
        add('rect', { x: 6.6, y: -9, width: .9, height: 10, fill });
        add('path', { d: 'M5.7 -9.4 h2.8 v2.6 l-1.4 1.1 -1.4 -1.1 z', fill });
        break;
      case 'shuttle':
        add('path', { d: 'M6 -6 L9 -3 L7.8 -2 L5 -5 Z', fill });
        add('path', { d: 'M5 -5 L6.7 -7.5 L8.3 -5.8', fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        break;
      case 'oar':
        add('path', { d: 'M7 -10 L7 3', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('path', { d: 'M5.8 1.8 L8.3 2.8 L7.1 5.2 L5.1 4.4 Z', fill });
        break;
      case 'sail':
        add('path', { d: 'M7 5 L7 -8 L11 3 Z', fill });
        add('path', { d: 'M5 5 H11', fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        break;
      case 'board':
        add('rect', { x: 5.1, y: 8, width: 6, height: 1.4, rx: .6, fill });
        add('circle', { cx: 6.3, cy: 9.7, r: .5, fill });
        add('circle', { cx: 9.8, cy: 9.7, r: .5, fill });
        break;
      case 'climb':
        add('path', { d: 'M8 -9 L9 -4 L7 -1 L9 2', fill: 'none', stroke: fill, 'stroke-width': 1.35, 'stroke-linecap': 'round' });
        break;
      case 'surf':
        add('path', { d: 'M4.6 6 C6.8 8.5 9.5 8.5 11 6.8 C9.3 5.8 6.7 5.5 4.6 6 Z', fill });
        break;
      case 'music':
        add('path', { d: 'M7 -9 V-1 M7 -9 H10 V-7 H8.5 V-3.4', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('circle', { cx: 6.5, cy: 0, r: 1.2, fill });
        add('circle', { cx: 8.2, cy: -2.2, r: 1.2, fill });
        break;
      case 'golf':
        add('path', { d: 'M7 -9 V2', fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        add('path', { d: 'M7 -9 L10 -8 L8 -6 Z', fill });

        add('path', { d: 'M7 -8 L8 -5.7 L10.5 -5.5 L8.5 -3.9 L9.2 -1.5 L7 -2.7 L4.8 -1.5 L5.5 -3.9 L3.5 -5.5 L6 -5.7 Z', fill });
        break;
      case 'barbell':
        add('rect', { x: 4.2, y: -5.4, width: 6, height: 1, fill });
        add('rect', { x: 3.2, y: -6.5, width: .8, height: 3.2, fill });
        add('rect', { x: 10.2, y: -6.5, width: .8, height: 3.2, fill });
        break;
      case 'horse':
        add('path', { d: 'M6 0 L10 0 L10.8 -2.2 L9 -4 L8 -3 L7 -5 L6 -4 Z', fill });
        break;
      case 'wave':
        add('path', { d: 'M4.5 7.4 C5.6 6.5 6.6 6.5 7.6 7.4 C8.6 8.3 9.6 8.3 10.5 7.4', fill: 'none', stroke: fill, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
        break;
      case 'waveball':
        add('path', { d: 'M4.5 7.4 C5.6 6.5 6.6 6.5 7.6 7.4 C8.6 8.3 9.6 8.3 10.5 7.4', fill: 'none', stroke: fill, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
        add('circle', { cx: 9.5, cy: -4.8, r: 1.7, fill: 'none', stroke: fill, 'stroke-width': 1.25 });
        break;
      case 'run':
        add('path', { d: 'M6 0 L8 -4 L10 -2', fill: 'none', stroke: fill, 'stroke-width': 1.2, 'stroke-linecap': 'round' });
        break;
      case 'ribbon':
        add('path', { d: 'M6 -9 C9 -8 10 -5 7 -3 C5 -2 6 1 9 2', fill: 'none', stroke: fill, 'stroke-width': 1.35, 'stroke-linecap': 'round' });
        break;
      case 'spring':
        add('path', { d: 'M5 8 H10', fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        add('path', { d: 'M5.5 8 C6 6.5 7 6.5 7.5 8 C8 9.5 9 9.5 9.5 8', fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        break;
      case 'medal':
        add('circle', { cx: 7.6, cy: -6, r: 1.8, fill });
        add('path', { d: 'M6.7 -7.6 L7.6 -9.3 L8.5 -7.6', fill: 'none', stroke: fill, 'stroke-width': 1.1 });
        break;
      default:
        add('circle', { cx: 7.2, cy: -5.2, r: 1.7, fill });
    }
  }

  function buildPerson(athlete) {
    const g = makeEl('g', { class: 'person', 'data-id': athlete.id }, athletesLayer);
    const outline = createSprite(g, athlete, false);
    athlete.el = g;
    athlete.outline = outline;
    athlete.x = width * (0.15 + Math.random() * 0.7);
    athlete.y = 120 + Math.random() * (height - 240);
    athlete.scale = athlete.height_scale || 1;
    athlete.tx = athlete.x;
    athlete.ty = athlete.y;
    athlete.tscale = athlete.scale;
    g.setAttribute('transform', `translate(${athlete.x.toFixed(2)} ${athlete.y.toFixed(2)}) scale(${athlete.scale})`);
    g.addEventListener('mouseenter', (e) => showTooltip(e, athlete));
    g.addEventListener('mousemove', moveTooltip);
    g.addEventListener('mouseleave', hideTooltip);
    g.addEventListener('click', (e) => {
      e.stopPropagation();
      selectAthlete(athlete, e.clientX, e.clientY);
    });
  }

  function avatarSVGMarkup(athlete) {
    const [c1, c2] = colorsForFamily(athlete.sport_family);
    const pony = athlete.gender === 'Female';
    const fill = c2;
    const skin = '#f1c7a0';
    const hair = athlete.gender === 'Female' ? '#5c4034' : '#2d2f35';
    let prop = '';
    const p = athlete.prop;
    if (p === 'sword') prop = `<rect x="31" y="14" width="3" height="22" fill="${fill}"/><rect x="29" y="28" width="7" height="2.2" fill="${fill}"/>`;
    else if (p === 'bike') prop = `<circle cx="16" cy="39" r="4" fill="none" stroke="${fill}" stroke-width="1.5"/><circle cx="38" cy="39" r="4" fill="none" stroke="${fill}" stroke-width="1.5"/><path d="M16 39 L25 30 L29 39 L38 39 L25 30 L29 26" fill="none" stroke="${fill}" stroke-width="1.5"/>`;
    else if (p === 'basketball') prop = `<circle cx="39" cy="20" r="5" fill="none" stroke="${fill}" stroke-width="1.7"/><path d="M34 20 H44 M39 15 V25" fill="none" stroke="${fill}" stroke-width="1.1"/>`;
    else if (p === 'soccer') prop = `<circle cx="39" cy="39" r="4.2" fill="white" stroke="${fill}" stroke-width="1.4"/><rect x="37.4" y="37.4" width="3.2" height="3.2" fill="${fill}"/>`;
    else if (p === 'volleyball') prop = `<circle cx="39" cy="21" r="4.5" fill="none" stroke="${fill}" stroke-width="1.5"/><path d="M35 21 C37 18.5 41 18.5 43 21 M36 24 C38 22.8 40 22.8 42 24" fill="none" stroke="${fill}" stroke-width="1"/>`;
    else if (p === 'target') prop = `<circle cx="39" cy="20" r="5.6" fill="none" stroke="${fill}" stroke-width="1.3"/><circle cx="39" cy="20" r="3" fill="none" stroke="${fill}" stroke-width="1.1"/><circle cx="39" cy="20" r="1.1" fill="${fill}"/>`;
    else if (p === 'oar' || p === 'paddle') prop = `<rect x="32" y="12" width="2" height="24" fill="${fill}"/><path d="M29 33 L35 35 L33 41 L28 39 Z" fill="${fill}"/>`;
    else if (p === 'sail') prop = `<path d="M33 40 L33 12 L44 34 Z" fill="${fill}"/><path d="M28 40 H44" fill="none" stroke="${fill}" stroke-width="1.2"/>`;
    else if (p === 'golf') prop = `<path d="M33 12 V35" fill="none" stroke="${fill}" stroke-width="1.5"/><path d="M33 12 L41 14 L36 19 Z" fill="${fill}"/>`;
    else prop = `<circle cx="39" cy="20" r="3.7" fill="${fill}"/>`;

    return `<svg viewBox="0 0 54 54" aria-hidden="true"><g transform="translate(16 10)">
      <rect x="-6" y="26" width="12" height="1.6" fill="rgba(31,40,51,.10)"/>
      <rect x="-3" y="-2" width="6" height="6" rx="1" fill="${skin}"/>
      <rect x="-3.6" y="-2.6" width="7.2" height="3.2" fill="${hair}"/>
      ${pony ? `<rect x="3.2" y="0" width="2" height="5" fill="${hair}"/><rect x="3.6" y="5" width="1.4" height="2" fill="${c2}"/>` : ''}
      <rect x="-4.6" y="5" width="9.2" height="8" rx="1.2" fill="${c1}"/>
      <rect x="-2.6" y="6.6" width="5.2" height="1.2" fill="rgba(255,255,255,.4)"/>
      <rect x="-4.6" y="13" width="9.2" height="3.8" rx="1" fill="${c2}"/>
      <rect x="-6.4" y="5.5" width="1.8" height="7" rx=".7" fill="${c2}"/>
      <rect x="4.6" y="5.5" width="1.8" height="7" rx=".7" fill="${c2}"/>
      <rect x="-3.5" y="16.5" width="2.4" height="8.4" rx=".8" fill="#39424c"/>
      <rect x="1.1" y="16.5" width="2.4" height="8.4" rx=".8" fill="#39424c"/>
      <rect x="-3.9" y="24.4" width="3.4" height="1.8" fill="#10161d"/>
      <rect x=".7" y="24.4" width="3.4" height="1.8" fill="#10161d"/>
      <g>${prop}</g></g></svg>`;
  }

  function showTooltip(event, athlete) {
    tooltip.style.display = 'block';
    tooltip.innerHTML = `<strong>${escapeHTML(athlete.name)}</strong>${escapeHTML(athlete.discipline)} · ${escapeHTML(athlete.events || 'No event listed')}`;
    moveTooltip(event);
  }

  function moveTooltip(event) {
    const pad = 8;
    const rect = tooltip.getBoundingClientRect();
    let x = event.clientX + 8;
    let y = event.clientY + 8;
    if (x + rect.width + pad > window.innerWidth) x = window.innerWidth - rect.width - pad;
    if (y + rect.height + pad > window.innerHeight) y = event.clientY - rect.height - 8;
    tooltip.style.left = `${Math.max(pad, x)}px`;
    tooltip.style.top = `${Math.max(pad, y)}px`;
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
  }

  function selectAthlete(athlete, clientX, clientY) {
    selectedAthlete = athlete;
    rawAthletes.forEach(a => a.el.classList.toggle('selected', a === athlete));
    const detailBlocks = [];
    if (athlete.nickname) detailBlocks.push(`<div class="note-block"><h3>Nickname</h3><p>${escapeHTML(athlete.nickname)}</p></div>`);
    if (athlete.hobbies) detailBlocks.push(`<div class="note-block"><h3>Hobbies</h3><p>${escapeHTML(athlete.hobbies)}</p></div>`);
    if (athlete.education) detailBlocks.push(`<div class="note-block"><h3>Education</h3><p>${escapeHTML(athlete.education)}</p></div>`);

    popover.innerHTML = `
      <div class="popover-header">
        <div class="avatar-card"><svg viewBox="0 0 84 84" aria-hidden="true"><g class="avatar-root" transform="translate(42 49) scale(1.95)"></g></svg></div>
        <div>
          <h2>${escapeHTML(athlete.name)}</h2>
          <div class="meta">${escapeHTML(athlete.sport_family)} · ${escapeHTML(athlete.discipline)}<br>${escapeHTML(athlete.events || 'No event listed')}</div>
        </div>
        <button class="close-btn" type="button" aria-label="Close">×</button>
      </div>
      <div class="popover-body">
        <dl class="detail-grid">
          <dt>Gender</dt><dd>${escapeHTML(athlete.gender)}</dd>
          <dt>Age</dt><dd>${athlete.age ?? 'Unknown'}${athlete.age_group ? ` · ${escapeHTML(athlete.age_group)}` : ''}</dd>
          <dt>Height</dt><dd>${fmtHeight(athlete.height_cm)}${athlete.height_group ? ` · ${escapeHTML(athlete.height_group)}` : ''}</dd>
          <dt>Birthplace</dt><dd>${escapeHTML(athlete.birth_place || 'Unknown')}${athlete.birth_country ? `, ${escapeHTML(athlete.birth_country)}` : ''}</dd>
          <dt>Birth region</dt><dd>${escapeHTML(athlete.birth_region)}</dd>
          <dt>Family key</dt><dd>${escapeHTML(athlete.sport_family)}</dd>
        </dl>
        ${detailBlocks.join('') || '<div class="note-block"><h3>Notes</h3><p>No extra bio notes were available for this athlete.</p></div>'}
      </div>`;
    const avatarRoot = popover.querySelector('.avatar-root');
    if (avatarRoot) createSprite(avatarRoot, athlete, true);
    popover.querySelector('.close-btn').addEventListener('click', closePopover);
    positionPopover(clientX, clientY);
    popover.style.display = 'block';
    backdrop.style.display = 'block';
  }

  function positionPopover(clientX, clientY) {
    const pad = 12;
    popover.style.left = '0px';
    popover.style.top = '0px';
    popover.style.display = 'block';
    const rect = popover.getBoundingClientRect();
    let x = clientX + 16;
    let y = clientY + 16;
    if (x + rect.width + pad > window.innerWidth) x = clientX - rect.width - 16;
    if (y + rect.height + pad > window.innerHeight) y = Math.max(pad, window.innerHeight - rect.height - pad);
    if (x < pad) x = pad;
    if (y < pad) y = pad;
    popover.style.left = `${x}px`;
    popover.style.top = `${y}px`;
  }

  function closePopover() {
    popover.style.display = 'none';
    backdrop.style.display = 'none';
    selectedAthlete = null;
    rawAthletes.forEach(a => a.el.classList.remove('selected'));
  }

  function initControls() {
    VIEW_OPTIONS.forEach((opt, i) => {
      const btn = makeHTML('button', { class: 'view-btn' + (i === 0 ? ' active' : ''), type: 'button', text: opt.label }, viewButtons);
      btn.addEventListener('click', () => {
        currentView = opt.key;
        document.querySelectorAll('.view-btn').forEach(el => el.classList.toggle('active', el === btn));
        updateLayout();
      });
    });

    searchInput.addEventListener('input', () => {
      searchTerm = searchInput.value.trim().toLowerCase();
      applyFilters();
    });

    shuffleBtn.addEventListener('click', () => {
      rawAthletes.forEach(a => {
        a.x += (Math.random() - .5) * 26;
        a.y += (Math.random() - .5) * 26;
      });
      updateLayout(true);
    });

    backdrop.addEventListener('click', closePopover);
    document.addEventListener('click', (e) => {
      if (popover.style.display === 'block' && !popover.contains(e.target) && !e.target.closest('.person')) {
        closePopover();
      }
    });
    window.addEventListener('resize', () => {
      updateLayout();
      if (selectedAthlete) closePopover();
    });
  }

  function updateLegend() {
    legend.innerHTML = '';
    const counts = countBy(rawAthletes, a => a.sport_family);
    Object.keys(FAMILY_STYLES).forEach(family => {
      const [c1, c2] = colorsForFamily(family);
      const item = makeHTML('div', { class: 'legend-chip', tabindex: '0' }, legend);
      item.style.setProperty('--c1', c1);
      item.style.setProperty('--c2', c2);
      item.innerHTML = `<span class="dual-swatch"></span><span class="text"><span class="name">${escapeHTML(family)}</span><span class="count">${counts.get(family) || 0} athletes</span></span>`;
      const activate = () => {
        hoveredFamily = family;
        applyFilters();
        [...legend.children].forEach(ch => ch.classList.toggle('active-hover', ch === item));
        [...legend.children].forEach(ch => ch.classList.toggle('faded', ch !== item));
      };
      const clear = () => {
        hoveredFamily = null;
        applyFilters();
        [...legend.children].forEach(ch => { ch.classList.remove('active-hover'); ch.classList.remove('faded'); });
      };
      item.addEventListener('mouseenter', activate);
      item.addEventListener('mouseleave', clear);
      item.addEventListener('focus', activate);
      item.addEventListener('blur', clear);
    });
  }

  function updateStats(groups) {
    const visible = rawAthletes.filter(a => matchesSearch(a));
    const label = VIEW_OPTIONS.find(v => v.key === currentView)?.label || currentView;
    const groupCount = groups.length;
    const hiddenByLegend = hoveredFamily ? ` · Focused on <strong>${escapeHTML(hoveredFamily)}</strong>` : '';
    stats.innerHTML = `<strong>${visible.length}</strong> of <strong>${rawAthletes.length}</strong> athletes shown · Viewing by <strong>${escapeHTML(label)}</strong> across <strong>${groupCount}</strong> group${groupCount === 1 ? '' : 's'}${hiddenByLegend}<span class="substat">Select a view, search the roster, or click any athlete for more details.</span>`;
  }

  function chooseColumns(n) {
    if (n <= 3) return n;
    if (n <= 4) return 2;
    if (n <= 6) return 3;
    if (n <= 9) return 3;
    if (n <= 12) return 4;
    return 4;
  }

  function getGroups() {
    const opt = VIEW_OPTIONS.find(v => v.key === currentView);
    const counts = countBy(rawAthletes, a => a[currentView] || 'Unknown');
    let names = Array.from(counts.keys());
    if (opt && Array.isArray(opt.order)) {
      const extras = names.filter(n => !opt.order.includes(n)).sort();
      names = opt.order.filter(n => counts.has(n)).concat(extras);
    } else {
      names.sort();
    }
    return names.map(name => ({ name, count: counts.get(name) || 0, athletes: rawAthletes.filter(a => (a[currentView] || 'Unknown') === name) }));
  }

  function buildLayoutBoxes(groups) {
    const cols = chooseColumns(groups.length);
    const rows = Math.ceil(groups.length / cols);
    const topPad = 34;
    const outerPadX = 26;
    const outerPadY = 28;
    const gapX = 18;
    const gapY = 22;
    const boxW = (width - outerPadX * 2 - gapX * (cols - 1)) / cols;
    const boxH = (height - outerPadY * 2 - gapY * (rows - 1)) / rows;
    return groups.map((g, i) => {
      const col = i % cols;
      const row = Math.floor(i / cols);
      return {
        group: g,
        x: outerPadX + col * (boxW + gapX),
        y: outerPadY + row * (boxH + gapY),
        w: boxW,
        h: boxH,
        innerTop: topPad
      };
    });
  }

  function drawLabels(boxes) {
    labelsLayer.innerHTML = '';
    boxes.forEach(box => {
      makeEl('rect', { x: box.x, y: box.y, width: box.w, height: box.h, rx: 18, class: 'group-box' }, labelsLayer);
      const cx = box.x + box.w / 2;
      makeEl('text', { x: cx, y: box.y + 22, class: 'label' }, labelsLayer).textContent = box.group.name;
      makeEl('text', { x: cx, y: box.y + 39, class: 'label-count' }, labelsLayer).textContent = `${box.group.count} athlete${box.group.count === 1 ? '' : 's'}`;
    });
  }

  function assignTargets(boxes, shuffle = false) {
    boxes.forEach(box => {
      const athletes = box.group.athletes.slice().sort((a, b) => {
        // ordered by height descending within group for nicer skyline
        const ha = a.height_cm || 0;
        const hb = b.height_cm || 0;
        if (hb !== ha) return hb - ha;
        return a.name.localeCompare(b.name);
      });
      const innerX = box.x + 14;
      const innerY = box.y + box.innerTop + 20;
      const innerW = box.w - 28;
      const innerH = box.h - box.innerTop - 30;
      const approxCols = Math.max(3, Math.floor(innerW / 17));
      const cols = Math.min(approxCols, Math.max(1, Math.ceil(Math.sqrt(athletes.length * (innerW / Math.max(100, innerH))))));
      const rows = Math.max(1, Math.ceil(athletes.length / cols));
      const cellW = innerW / cols;
      const cellH = innerH / rows;
      athletes.forEach((a, index) => {
        const col = index % cols;
        const row = Math.floor(index / cols);
        const x = innerX + cellW * (col + .5);
        const y = innerY + cellH * (row + .62);
        a.tx = x + (shuffle ? (Math.random() - .5) * 5 : 0);
        a.ty = y + (shuffle ? (Math.random() - .5) * 5 : 0);
        a.tscale = a.height_scale || 1;
      });
    });
  }

  function easeInOut(t) { return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }

  function animate() {
    const token = ++animationToken;
    const start = performance.now();
    const duration = 920;
    rawAthletes.forEach(a => a.el.classList.add('running'));
    const sx = rawAthletes.map(a => a.x); const sy = rawAthletes.map(a => a.y); const ss = rawAthletes.map(a => a.scale);

    function frame(now) {
      if (token !== animationToken) return;
      const t = Math.min(1, (now - start) / duration);
      const e = easeInOut(t);
      rawAthletes.forEach((a, i) => {
        a.x = sx[i] + (a.tx - sx[i]) * e;
        a.y = sy[i] + (a.ty - sy[i]) * e;
        a.scale = ss[i] + (a.tscale - ss[i]) * e;
        a.el.setAttribute('transform', `translate(${a.x.toFixed(2)} ${a.y.toFixed(2)}) scale(${a.scale.toFixed(3)})`);
      });
      if (t < 1) requestAnimationFrame(frame);
      else rawAthletes.forEach(a => a.el.classList.remove('running'));
    }
    requestAnimationFrame(frame);
  }

  function matchesSearch(a) {
    if (!searchTerm) return true;
    const hay = `${a.name} ${a.sport_family} ${a.discipline} ${a.events} ${a.birth_place} ${a.birth_country}`.toLowerCase();
    return hay.includes(searchTerm);
  }

  function applyFilters() {
    rawAthletes.forEach(a => {
      const searchMiss = !matchesSearch(a);
      const familyMiss = hoveredFamily && a.sport_family !== hoveredFamily;
      a.el.classList.toggle('dimmed', searchMiss);
      a.el.classList.toggle('legend-dimmed', !!familyMiss);
      const targetOpacity = searchMiss || familyMiss ? '' : '';
    });
    updateStats(lastLayoutGroups);
  }

  function updateLayout(shuffle = false) {
    const rect = svg.getBoundingClientRect();
    width = Math.max(320, rect.width || 1200);
    height = Math.max(760, rect.height || 860);
    svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
    const groups = getGroups();
    lastLayoutGroups = groups;
    const boxes = buildLayoutBoxes(groups);
    drawLabels(boxes);
    assignTargets(boxes, shuffle);
    animate();
    applyFilters();
  }

  function init() {
    rawAthletes.forEach(buildPerson);
    initControls();
    updateLegend();
    updateLayout();
  }

  init();
})();
</script>
</body>
</html>
